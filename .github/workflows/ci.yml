name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: Gofmt
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: |
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./wasm
      - name: Test (race)
        run: go test -race -short -cover ./...
      # Compiling the module and brotli-compressing 23 MiB at quality 11 is
      # minutes under the race detector: this one runs without it.
      - name: Test the WebAssembly module build and its size budget
        run: go test -timeout 20m -run TestModule -v ./cmd/build
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type check
        run: npm run check
      - name: Build (WebAssembly module, bundles)
        run: npm run build
      - name: Smoke test in VS Code (activation, preview, diagnostics, completion, timings)
        run: xvfb-run -a npm test
      - name: Package
        run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
